name: CI and security gates
on:
  push: { branches: [main, dev] }
  pull_request:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Dependency scan (our own tool)
        run: node bin/vulnsight.js scan . --scanners=sca --fail-on=high
        # examples/ holds intentionally vulnerable demo apps; scan them with npm run scan:examples.
      - name: Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: SAST (Semgrep)
        run: pipx run semgrep scan --config p/javascript --config p/nodejs --error --metrics=off src web
      - name: IaC (Checkov)
        run: pipx run checkov -d deploy --quiet --compact --soft-fail

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t vulnsight-api .
      - run: docker build -f deploy/Dockerfile.worker -t vulnsight-worker .
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy image scan (API)
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed vulnsight-api
      - name: Trivy image scan (worker)
        run: trivy image --severity CRITICAL --ignore-unfixed vulnsight-worker
