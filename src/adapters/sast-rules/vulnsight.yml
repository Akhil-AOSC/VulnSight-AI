rules:
  - id: javascript.express.security.audit.xss.direct-response-write
    message: User input written into the HTTP response (XSS)
    languages: [js, ts]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      category: security
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: process.argv
    pattern-sinks:
      - pattern: res.send($SINK)
      - pattern: res.write($SINK)
      - pattern: res.end($SINK)

  - id: javascript.lang.security.detect-child-process
    message: User input concatenated into a shell command
    languages: [js, ts]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      category: security
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: process.argv
    pattern-sinks:
      - pattern: exec($SINK)
      - pattern: execSync($SINK)
      - pattern: spawn($SINK, ...)
      - pattern: spawnSync($SINK, ...)

  - id: javascript.lang.security.detect-eval-with-expression
    message: Dynamic eval() of untrusted input
    languages: [js, ts]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      category: security
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
      - pattern: process.argv
    pattern-sinks:
      - pattern: eval($SINK)

  - id: python.lang.security.audit.subprocess-shell-true
    message: subprocess invoked with shell=True
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      category: security
    pattern-either:
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python.lang.security.audit.os-system
    message: os.system() used to run a command
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      category: security
    pattern: os.system(...)
