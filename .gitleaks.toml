# The insecure example app and test files contain deliberately fake credentials used to test the scanners.
title = "VulnSight AI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and test mock tokens"
paths = [
  '''(?i)examples/.*''',
  '''(?i)test/.*''',
]
stopwords = [
  "ghp_7Xq2LmN9vB4kTz1RcWe8YhUd3JpA6sFoGx0Q",
  "ghp_SuperSecretRepoToken0123456789",
  "ghp_BackupTestToken123456",
  "hooks.slack.com",
]
